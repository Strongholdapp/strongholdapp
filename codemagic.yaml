workflows:
  # ============================================================
  # Stronghold iOS , build na nuvem e publicação na conta App Store
  # Connect do Lucas. Não precisa de Mac.
  #
  # ANTES DO PRIMEIRO BUILD, no painel do Codemagic:
  #  1. Teams > Integrations > App Store Connect > "Add key"
  #     Cole a API Key que o Lucas gerar (Issuer ID + Key ID + arquivo .p8).
  #     Dê a ela o nome EXATO: Stronghold ASC
  #  2. Environment variables > crie o grupo "stronghold" com:
  #       EXPO_PUBLIC_SUPABASE_URL
  #       EXPO_PUBLIC_SUPABASE_ANON_KEY
  #       EXPO_PUBLIC_SUPERWALL_API_KEY     (quando chegar do Lucas)
  #       APP_STORE_APPLE_ID                (o "Apple ID" numérico do app,
  #                                          em App Store Connect > App Information)
  #  3. Rode o workflow "ios-testflight" primeiro. Só depois o de produção.
  # ============================================================

  ios-testflight:
    name: Stronghold iOS , TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Stronghold ASC
    environment:
      groups:
        - stronghold
      vars:
        XCODE_WORKSPACE: "ios/Stronghold.xcworkspace"
        XCODE_SCHEME: "Stronghold"
        BUNDLE_ID: "app.livestronghold.stronghold"
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.livestronghold.stronghold
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Instalar dependências
        script: npm ci

      - name: Expo prebuild (gera a pasta ios/ nativa)
        script: npx expo prebuild --platform ios --clean --no-install

      - name: CocoaPods
        script: |
          cd ios
          pod install

      - name: Assinatura (perfis da API Key)
        script: xcode-project use-profiles

      - name: Build number = último do TestFlight + 1
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))

      - name: Build do .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - leticiacostta2@hotmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:
        #   - Stronghold Internal

  # Mesma coisa, mas manda pra revisão da App Store. Rode só depois do
  # TestFlight passar. Publicação manual: você aperta "Release" na loja.
  ios-appstore:
    name: Stronghold iOS , App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Stronghold ASC
    environment:
      groups:
        - stronghold
      vars:
        XCODE_WORKSPACE: "ios/Stronghold.xcworkspace"
        XCODE_SCHEME: "Stronghold"
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.livestronghold.stronghold
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Expo prebuild
        script: npx expo prebuild --platform ios --clean --no-install
      - name: CocoaPods
        script: |
          cd ios
          pod install
      - name: Assinatura
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build do .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - leticiacostta2@hotmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        release_type: MANUAL
