          /usr/libexec/PlistBuddy -c "Print :FacebookAppID" "$APP/Info.plist" || { echo "FALTANDO NO BINARIO FINAL: FacebookAppID"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :SKAdNetworkItems" "$APP/Info.plist" || { echo "FALTANDO NO BINARIO FINAL: SKAdNetworkItems"; exit 1; }
