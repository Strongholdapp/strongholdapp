            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
      # Mesma prova nº 2 do workflow de TestFlight, ver explicação lá em cima.
      # Aqui importa ainda mais: daqui o .ipa vai pra revisão da App Store.
      - name: Verificar se o rastreamento foi compilado dentro do .ipa final
        script: |
          set -e
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA: $IPA"
